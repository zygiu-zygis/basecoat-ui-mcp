<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <!-- Minimalist dark squircle -->
  <rect width="80" height="80" rx="20" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
  
  <!-- Subtle inner bevel glow -->
  <rect x="1" y="1" width="78" height="78" rx="19" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  
  <!-- Basecoat layered coats (monochrome zinc & white, crisp architectural geometry) -->
  <g transform="translate(18, 18)">
    <!-- Top diamond layer -->
    <path d="M 22 4 L 38 13 L 22 22 L 6 13 Z" fill="#fafafa" />
    
    <!-- Middle coat layer -->
    <path d="M 6 19 L 22 28 L 38 19" stroke="#a1a1aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom coat layer -->
    <path d="M 6 26 L 22 35 L 38 26" stroke="#52525b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
